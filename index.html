<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About Me</title>
  <style>
    :root {
      --bg: #f4efe8;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #5f6b76;
      --accent: #c0392b;
      --border: #e3dbd0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161b22;
        --card: #1f262f;
        --text: #f0ebe4;
        --muted: #a3adb8;
        --accent: #ee7b6c;
        --border: #313a45;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 380px;
      padding: 40px 32px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-top: 6px solid var(--accent);
      border-radius: 12px;
    }

    .photo {
      width: 140px;
      height: 140px;
      margin-bottom: 20px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--accent);
    }

    h1 {
      margin: 0 0 6px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
    }

    .tagline {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 16px;
    }

    .email {
      display: inline-block;
      padding: 10px 22px;
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      border: 2px solid var(--accent);
      border-radius: 999px;
      transition: background 0.2s, color 0.2s;
    }

    .email:hover,
    .email:focus-visible {
      background: var(--accent);
      color: var(--card);
    }
  </style>
</head>
<body>
  <main class="card">
    <!-- Replace the src below with your own photo, e.g. src="me.jpg" -->
    <img class="photo" alt="Portrait of Israt Zaman"
      src="me.jpg">

    <h1>Israt Zaman</h1>
    <p class="tagline">Hello, nice to meet you!</p>

    <a class="email" href="mailto:moonstar12001@gmail.com">moonstar12001@gmail.com</a>
  </main>
</body>
</html>
